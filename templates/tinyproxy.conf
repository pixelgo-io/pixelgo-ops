#
# Template for tinyproxy. Generated by pixelgo-ops, not edited by hand.
#
# FilterDefaultDeny Yes means: refuse everything not in the Filter file.
# Whitelist, not blacklist - see README.
#
# Two settings here are the difference between a whitelist and the appearance
# of one, and both were wrong in the first version of this file. Each was
# verified against tinyproxy 1.11.1 rather than reasoned about.
#
# FilterType ere - without it tinyproxy uses basic regular expressions, in
# which "(", ")" and "+" are literal characters. The anchored patterns that
# pixelgo-ops generates then match NOTHING, and every request is refused,
# including the ones that should be allowed. That direction is at least
# fail-closed, but it presents as "the proxy is broken" with no clue why.
#
# No FilterURLs - it switches matching from the host to the whole URL, which
# tinyproxy's own manual says works only for plain HTTP, because HTTPS hides
# the URL. Matching on the host is what we want and what works for both:
# tinyproxy strips the port before matching, so an anchored host pattern
# applies to "CONNECT host:443" as well as to a plain GET.
#
# Case is insensitive by default, which is correct for domain names.
#

Port {{.Port}}
Listen {{.ListenAddr}}

# the VM's network only
Allow {{.VMNetwork}}

Filter "{{.FilterFile}}"
FilterType ere
FilterDefaultDeny Yes

LogFile "{{.LogPath}}"
LogLevel Connect

PidFile "{{.PidFile}}"

# no cache and no headers that might leak information
DisableViaHeader Yes
