Port {{.Port}}
Listen {{.ListenAddr}}

# the VM's network only
Allow {{.VMNetwork}}

FilterURLs On
Filter "{{.Allowlist}}"
FilterDefaultDeny Yes

LogFile "{{.LogPath}}"
LogLevel Connect

# no cache and no headers that might leak information
DisableViaHeader Yes
