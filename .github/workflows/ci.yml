# What stands between a broken commit and main.
#
# Four checks, in the order that fails fastest. Formatting and vet take seconds
# and catch the things most likely to be wrong; the cross-build is last because
# it is the slowest and the rarest to break.
#
# The actions are pinned by major tag rather than by commit. A tag can be moved,
# so this is a smaller guarantee than a digest - acceptable here because both
# are published by GitHub's own org, and worth knowing rather than assuming.

name: CI

on:
  push:
  pull_request:

# The default token can write to the repository. Nothing here needs that.
permissions:
  contents: read

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Read from go.mod rather than written here, so the version lives in one
      # place and raising it is a visible edit to a file people read - not a
      # line in a workflow nobody opens.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # gofmt reports files, it does not fail. An empty report is the pass.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The proxy tests start the real binary and assert what its filter does
      # with the patterns we generate. Without it installed they skip - and the
      # thing they check is the one that failed permissive and silent once
      # already, so skipping them here would leave it unchecked everywhere.
      - name: install tinyproxy and nftables
        run: |
          sudo apt-get update
          sudo apt-get install -y tinyproxy nftables

      # The Ubuntu package ships /etc/apparmor.d/tinyproxy in enforce mode, and
      # that profile only lets tinyproxy read a configuration under
      # /etc/tinyproxy. We generate ours in the ops directory, so the binary
      # starts, is refused the file, and reports "Could not open config file"
      # about a file that is plainly there. Complain mode keeps the profile
      # loaded and still logging, so the tests can run.
      #
      # A workaround for the TESTS, not a fix for the product: pixelgo-ops hits
      # the same wall on any Ubuntu host with the distro package.
      - name: put the tinyproxy apparmor profile in complain mode
        run: |
          if [ -f /etc/apparmor.d/tinyproxy ]; then
            sudo apt-get install -y apparmor-utils
            sudo aa-complain /etc/apparmor.d/tinyproxy
          else
            echo "no tinyproxy apparmor profile on this runner"
          fi

      # -race because the engine client runs an HTTP client over a socket and
      # the watcher will poll on a timer: both are places where a data race is
      # easy to write and almost impossible to notice by hand.
      - name: go test
        run: go test ./... -race

      # The firewall tests load real nftables rules and build a network
      # namespace to ask from, so they need root and skip without it. The step
      # above runs as the normal user, which means the one thing in this
      # repository that fails permissive and silent would be the one thing
      # nothing checks.
      #
      # The binary is compiled first and then run under sudo, rather than
      # running `sudo go test`: that way sudo needs no Go toolchain, no module
      # cache and no environment carried across, and the step cannot fail for
      # reasons that have nothing to do with the test.
      - name: build the privileged tests
        run: go test -c ./internal/proxy/ -o /tmp/proxy.test

      - name: run the privileged tests
        run: sudo /tmp/proxy.test -test.run 'Firewall|Ruleset|ApplyTwice|RemoveIsScoped|VerifyNotices|ARealRefusal' -test.v

      # The only check that compiles hyperv.go at all. It is behind
      # //go:build windows, so a Linux build and the whole test suite can pass
      # while that file does not compile. Without this step, the Windows
      # backend is unverified code that looks verified.
      - name: cross-build
        run: make cross
